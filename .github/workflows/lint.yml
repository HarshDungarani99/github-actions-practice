# What is the goal of your worlflow
# Goal: Whenever sommeone pushes their code changes in any python file
# The linter will check if there are any syntax error, format, indentation (Linting) or not
name: Linter

on: 
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
    # this step will automaticallt clone the code of the current branch into the runner
      - name: clone the code
        uses: actions/checkout@v7

      - name: install ruff for linter
        run: pip install ruff
